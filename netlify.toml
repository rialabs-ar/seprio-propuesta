[build]
  publish = "public"
  functions = "netlify/functions"

# Mismo comportamiento de cache que tenía server.mjs en Render:
# el HTML nunca se cachea (la presentación se corrige sobre la marcha),
# los assets sí.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"
